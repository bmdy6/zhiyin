[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-mac-export"
version = "0.1.0"
description = "Offline export of macOS WeChat 4.2.0 database snapshots with a supplied master key"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pycryptodome>=3.20,<4", "zstandard>=0.22,<1"]

[project.scripts]
wechat-mac-export = "wechat_mac_export.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
