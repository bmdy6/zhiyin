[project]
name = "zhiyin"
version = "0.2.0"
description = "Local WeChat reply drafting MCP"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "numpy>=2,<3",
    "fastembed>=0.7,<1",
    "mcp>=1.20,<2",
    "jieba>=0.42.1,<1",
    "rank-bm25>=0.2.2,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[project.scripts]
zhiyin-mcp = "zhiyin.server:main"
zhiyin = "zhiyin.cli:main"
chat-twin = "zhiyin.cli:legacy_main"
chat-twin-mcp = "zhiyin.server:legacy_main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zhiyin"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "zhiyin/resources/prompts"
"profiles" = "zhiyin/resources/profiles"
"vendor" = "zhiyin/resources/vendor"
