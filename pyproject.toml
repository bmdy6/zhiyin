[project]
name = "chat-twin"
version = "0.1.0"
description = "Local hybrid retrieval MCP over public chat examples"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "numpy>=2,<3",
    "fastembed>=0.7,<1",
    "mcp>=1.20,<2",
    "jieba>=0.42.1,<1",
    "rank-bm25>=0.2.2,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[project.scripts]
chat-twin-mcp = "chat_twin.server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chat_twin"]
